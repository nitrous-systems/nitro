[package]
name = "nitro-launcher"
description = "The nitro application launcher: a Super-tap overlay that searches .desktop files and spawns what you pick"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The toolkit, and nothing else.
#
# The spec allowed `rustix` too, for `fork`/`setsid` in the spawn path.
# It turned out not to be needed: `std::process::Command` already has
# `process_group(0)`, which is the safe half of `setsid` and the half a
# launcher actually needs (see `src/spawn.rs`). So the shipped launcher
# is `nitro-ui` and `std`, like `nitro-calc`.
nitro-ui = { workspace = true }

[lib]
name = "nitro_launcher"
path = "src/lib.rs"

[[bin]]
name = "nitro-launcher"
path = "src/main.rs"

[dev-dependencies]
# The in-process harness: a real server on the fake backend, a real shell
# connection, real pixels, real keys. A dev-dependency, so the shipped
# binary never links the compositor.
nitro-ui = { workspace = true, features = ["test-support"] }
# `getpgrp`, for the one test that asserts a launched process really did
# leave the launcher's process group. A dev-dependency because that is
# the only use: the spawn path itself needs no syscall crate.
rustix = { workspace = true, features = ["process"] }
# `tests/launcher.rs` opens a second, ordinary client: one to hold the
# keyboard focus (so "the grab delivered this key" can be told apart from
# "the launcher happened to be focused"), and one to *take* focus, which
# is what the launcher hides on. That is raw wire, so the test names the
# wire crate; the shipped launcher does not.
nitro-wire = { workspace = true }
nitro-core = { workspace = true }
# `Image`, the shape a whole-output `shot` readback comes back in. One
# test compares two of them pixel for pixel (the launcher must not be on
# screen before the first Super tap), which is the only use.
nitro-kms = { workspace = true }
