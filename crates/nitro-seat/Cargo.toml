[package]
name = "nitro-seat"
description = "Safe libseat wrapper: the server's ownership root for privileged device fds"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `custom_logger` (default) compiles a C shim to route libseat's log lines
# through `log`; we return data instead of logging, so it stays off.
libseat = { version = "0.2", default-features = false }

[lints]
workspace = true
