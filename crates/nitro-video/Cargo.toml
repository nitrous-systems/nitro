[package]
name = "nitro-video"
description = "A native video player: FFmpeg demux, VA-API or software decode (system libav*), NV12 frames (shm or dma-buf) into a Surface node, nitro-ui controls"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# The toolkit: window, controls, and the Surface present path (#3906).
nitro-ui = { workspace = true }
# Geometry types (`IRect`) shared with the wire.
nitro-core = { workspace = true }
# Sealed memfds for the NV12 ring the server maps.
nitro-shm = { workspace = true }
# The Surface message types (`CreateSurfaceBuffer`, `PresentSurface`).
nitro-wire = { workspace = true }
# The decode thread's non-blocking wake pipe; `CLOCK_MONOTONIC` for pacing.
rustix = { workspace = true, features = ["pipe", "time"] }

[lib]
name = "nitro_video"
path = "src/lib.rs"

[[bin]]
name = "nitro-video"
path = "src/main.rs"

[dev-dependencies]
# The in-process harness: a real server on the fake backend. Never
# linked into the shipped binary.
nitro-ui = { workspace = true, features = ["test-support"] }
# Tests name wire types (window state) directly.
nitro-wire = { workspace = true }
