[package]
name = "nitro-server"
description = "The nitro display server: seat + KMS event loop with a control socket"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nitro-core = { path = "../nitro-core" }
nitro-wire = { version = "0.0.1", path = "../nitro-wire" }
nitro-scene = { path = "../nitro-scene" }
nitro-raster = { path = "../nitro-raster" }
nitro-text = { path = "../nitro-text" }
nitro-icons = { path = "../nitro-icons" }
# The PNG decoder application icons come out of (#3711): no dependencies
# of its own, so this is one crate and not nine.
nitro-png = { path = "../nitro-png" }
nitro-seat = { path = "../nitro-seat" }
nitro-kms = { path = "../nitro-kms" }
rustix = { version = "1", features = ["event", "fs", "net", "process", "time"] }
# Self-pipe for SIGTERM/SIGINT without `unsafe` in our tree. Default
# features (iterator/channel) are off; only `low_level::pipe` is used.
signal-hook = { version = "0.4", default-features = false }
# libinput, without the udev backend: devices are opened through
# `nitro-seat` and added by path, so no `libudev` enters the tree.
input = { version = "0.10", default-features = false, features = ["libinput_1_21"] }
# Keymaps and keysym/UTF-8 resolution. The FFI `unsafe` lives in the crate.
xkbcommon = "0.9"

[features]
# A `pub` module that starts the whole server on the fake backend from
# another crate's test: `nitro-ui`'s harness is the consumer. Off by
# default so nothing links the control-socket client code in production.
test-support = []

[[example]]
name = "hello_client"

# Throwaway M3-B hardware probe for the shell socket; see `docs/shell.md`.
[[example]]
name = "shell_probe"
