[workspace]

[package]
name = "nitro-raster-compare"
version = "0.0.1"
edition = "2024"
publish = false

[[bin]]
name = "vello-bench"
path = "src/main.rs"

[dependencies]
# Default features (png, std, text, u8_pipeline). `multithreading` is deliberately
# OFF: we compare single-threaded CPU rasterization.
vello_cpu = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
