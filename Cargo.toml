[workspace]
resolver = "3"
members = ["crates/*"]
# Standalone comparison harnesses live outside the workspace.
exclude = ["crates/nitro-raster/compare"]

[workspace.package]
edition = "2024"
version = "0.0.1"
license = "Apache-2.0"
publish = false

# Pin external versions once; crates use `{ workspace = true }`.
[workspace.dependencies]
nitro-core   = { path = "crates/nitro-core" }
nitro-wire   = { path = "crates/nitro-wire" }
nitro-scene  = { path = "crates/nitro-scene" }
nitro-ui     = { path = "crates/nitro-ui" }
nitro-bar    = { path = "crates/nitro-bar" }
nitro-launcher = { path = "crates/nitro-launcher" }
nitro-wallpaper = { path = "crates/nitro-wallpaper" }
nitro-term   = { path = "crates/nitro-term" }
nitro-raster = { path = "crates/nitro-raster" }
nitro-text   = { path = "crates/nitro-text" }
nitro-seat   = { path = "crates/nitro-seat" }
nitro-kms    = { path = "crates/nitro-kms" }
rustix       = { version = "1", default-features = false, features = ["std"] }
drm          = "0.15"
libseat      = { version = "0.2", default-features = false }
signal-hook  = { version = "0.3", default-features = false }
input        = "0.10"
xkbcommon    = "0.9"
zerocopy     = { version = "0.8", features = ["derive"] }
swash        = "0.2"
vte          = { version = "0.15", default-features = false, features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Every crate must opt in with `[lints] workspace = true`.
[workspace.lints.rust]
# `deny`, not `forbid`: an explicit `#[allow(unsafe_code)]` on a module or
# item is the sanctioned exception path (kernel ABI shims, fd passing).
# Each exception carries a `// SAFETY:` comment and is listed in DEPENDENCIES.md.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Pedantic lints that fight the goals or the domain; each has a reason.
module_name_repetitions = "allow"   # `scene::SceneNode` is clearer than `scene::Node` at use sites
cast_possible_truncation = "allow"  # pixel math is i32/u32/f32 by nature; reviewed at the boundary
cast_precision_loss = "allow"
cast_sign_loss = "allow"
must_use_candidate = "allow"
